<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RubyChrist - Link Tree</title>
    <!-- Importamos una fuente moderna similar -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para los iconos de redes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #0b0f19;
            background-image: radial-gradient(circle at 50% 20%, #1a1f35 0%, #0b0f19 70%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Badge de estado superior */
        .status-badge {
            align-self: flex-start;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Avatar con aro brillante */
        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ef4444, #3b82f6);
            padding: 3px; /* Grosor del aro */
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.2);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #121826;
        }

        /* Títulos y subtítulos */
        .title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Sección de estadísticas */
        .stats-card {
            width: 100%;
            background: rgba(18, 24, 38, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            display: flex;
            justify-content: space-around;
            padding: 18px 10px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .stat-item {
            text-align: center;
            flex: 1;
            position: relative;
        }

        .stat-item:not(:last-child):after {
            content: '';
            position: absolute;
            right: 0;
            top: 20%;
            height: 60%;
            width: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .stat-number {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Botones de enlaces */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(18, 24, 38, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 16px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.25s ease;
            backdrop-filter: blur(10px);
        }

        .link-button:hover {
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .link-left i {
            font-size: 20px;
            width: 24px;
            text-align: center;
            color: #94a3b8;
        }

        .link-text {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .link-arrow {
            color: #64748b;
            font-size: 14px;
            transition: transform 0.2s ease;
        }

        .link-button:hover .link-arrow {
            transform: translateX(4px);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Badge Superior -->
        <div class="status-badge">
            <div class="status-dot"></div>
            Stream Online
        </div>

        <!-- Avatar / Logo -->
        <div class="avatar-container">
            <!-- Reemplaza el enlace de la imagen por tu propio logo o imagen -->
            <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400" alt="Avatar" class="avatar">
        </div>

        <!-- Títulos -->
        <h1 class="title">RubyChrist</h1>
        <p class="subtitle">Gaming &bull; Streams &bull; Content Creator</p>

        <!-- Estadísticas -->
        <div class="stats-card">
            <div class="stat-item">
                <div class="stat-number">5+</div>
                <div class="stat-label">Plataformas</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">Daily</div>
                <div class="stat-label">Streams</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">100%</div>
                <div class="stat-label">Community</div>
            </div>
        </div>

        <!-- Botones de Enlaces -->
        <div class="links-container">
            <a href="https://kick.com" target="_blank" class="link-button">
                <div class="link-left">
                    <i class="fa-solid fa-k"></i>
                    <span class="link-text">Kick Stream</span>
                </div>
                <i class="fa-solid fa-arrow-right link-arrow"></i>
            </a>

            <a href="https://youtube.com" target="_blank" class="link-button">
                <div class="link-left">
                    <i class="fa-brands fa-youtube"></i>
                    <span class="link-text">YouTube</span>
                </div>
                <i class="fa-solid fa-arrow-right link-arrow"></i>
            </a>

            <a href="https://tiktok.com" target="_blank" class="link-button">
                <div class="link-left">
                    <i class="fa-brands fa-tiktok"></i>
                    <span class="link-text">TikTok</span>
                </div>
                <i class="fa-solid fa-arrow-right link-arrow"></i>
            </a>

            <a href="https://instagram.com" target="_blank" class="link-button">
                <div class="link-left">
                    <i class="fa-brands fa-instagram"></i>
                    <span class="link-text">Instagram</span>
                </div>
                <i class="fa-solid fa-arrow-right link-arrow"></i>
            </a>

            <a href="https://discord.com" target="_blank" class="link-button">
                <div class="link-left">
                    <i class="fa-brands fa-discord"></i>
                    <span class="link-text">Discord Server</span>
                </div>
                <i class="fa-solid fa-arrow-right link-arrow"></i>
            </a>
        </div>
    </div>

</body>
</html>
